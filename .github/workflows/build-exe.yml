name: Build and Release Executable

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install hidapi
        if (Test-Path "requirements.txt") { pip install -r requirements.txt }

    - name: Build Console EXE with PyInstaller
      run: |
        pyinstaller --onefile --console x8se_dpi.py
        pyinstaller --onefile --noconsole Wiremouse.py

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
        name: ${{ github.ref_type == 'tag' && github.ref_name || 'Latest Build' }}
        files: |
          dist/x8se_dpi.exe
          dist/Wiremouse.exe
        generate_release_notes: true