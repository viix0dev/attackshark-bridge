name: Build and Release Executable

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on tags like v1.0.0, v2.1.0
  workflow_dispatch: # Keeps manual trigger available in Actions tab

permissions:
  contents: write # Grants permissions to create releases and upload assets

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install hidapi
        if (Test-Path "requirements.txt") { pip install -r requirements.txt }

    - name: Build Console EXE with PyInstaller
      run: |
        pyinstaller --onefile --console x8se_dpi.py

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: dist/x8se_dpi.exe
        generate_release_notes: true